#=======================================
# NDPR Bukkit/Paper 客户端配置文件
# NDPR Config (Bukkit/Paper)
#=======================================
# 官网: https://ndpreforged.com
# QQ群: 232760327
#=======================================
# API 地址,通常不需要修改
api-url: "https://api.ndpreforged.com"

#=======================================
# 语言设置 (zh_CN / en_us)
#=======================================
language: "zh_CN"

#=======================================
# Token(必填)
# 带上你的UUID前往官网绑定邮箱后自动发放
# 启用封禁功能必须配置此项
#=======================================
token: ""

#=======================================
# UUID
# 首次启动自动获取,无需手动填写
#=======================================
uuid: ""

#=======================================
# 服务器模式(必填)
# true = 正版服 (Online Server)
# false = 离线服 (Offline Server)
# 注意: 必须填写,否则插件不会正常加载
#=======================================
onlinemode: ""

#=======================================
# 机器验证(HWID)
# check-hwid: 是否启用机器验证
# check-interval: 检查间隔(天),默认3
#=======================================
check-hwid: false
check-interval: 3

#=======================================
# 封禁列表更新间隔(秒)
# 默认900秒(15分钟), 0 = 禁用自动更新
#=======================================
download-interval: 900

#=======================================
# 封禁数据库缺失时的策略
# false = 放行玩家并后台重试下载(默认,可用性优先)
# true  = 踢出玩家直到数据库可用(安全优先)
#=======================================
fail-closed: false

#=======================================
# HWID 设备验证超时(秒)
# 玩家超时未完成网页验证将被请离服务器
# 默认60秒, 最小30秒
#=======================================
verify-timeout: 60

#=======================================
# 验证期间 freeze 钉回坐标的间隔(秒)
# 间隔越小玩家被钉得越紧
# 默认1秒, 最小1秒
#=======================================
freeze-interval: 1
