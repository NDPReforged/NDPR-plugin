name: NDPR-Bukkit
version: '2.2.0'
main: org.ndpr.bukkit.NDPRPlugin
api-version: '26.3'
author: EXE_autumnwind NDPReforged Team
description: NDPReforged 的 Bukkit/Spigot/Paper 客户端插件(云端封禁 + HWID 设备验证)
website: https://ndpreforged.com
commands:
  ndpr:
    description: NDPR 主命令
    usage: /ndpr help
    aliases: [NDPR]
permissions:
  ndpr.admin:
    description: NDPR 管理权限(封禁/下载/重载等)
    default: op
